name: Content refresh (every 6h)

# Refreshes certification brand logos and compresses new project
# screenshots — 4 times a day, every 6 hours. Moved here from the
# portfolio repos so the images live next to the content that uses them.
#
# Ticks (UTC):   00:00   06:00   12:00   18:00
# Ticks (IST):   05:30   11:30   17:30   23:30
#
# Commits pushed with GITHUB_TOKEN don't trigger other workflows, so when
# this run commits something it calls the deploy hooks itself.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          for i in 1 2 3; do
            npm install --no-save --no-audit --no-fund sharp front-matter && break
            echo "npm install failed (attempt $i) — retrying in 10s"
            sleep 10
          done

      - name: Refresh certification logos
        continue-on-error: true
        run: node scripts/localize-cert-logos.mjs

      - name: Compress new project screenshots
        continue-on-error: true
        run: node scripts/compress-project-images.mjs

      - name: Commit and push if there are changes
        id: commit
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing changed — no commit needed."
            exit 0
          fi
          node scripts/validate.mjs

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(refresh): update cert logos / compress new project images

          Auto-generated by .github/workflows/refresh.yml"

          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push failed (attempt $i) — retrying in 15s"
            sleep 15
          done
          echo "push failed after 3 retries — next tick will try again in 6h"

      - name: Rebuild every template
        if: steps.commit.outputs.pushed == 'true'
        env:
          HOOKS: ${{ secrets.VERCEL_DEPLOY_HOOKS }}
        run: |
          [[ -z "$HOOKS" ]] && { echo "::warning::VERCEL_DEPLOY_HOOKS is not set."; exit 0; }
          while IFS= read -r hook; do
            [[ -n "$hook" ]] && curl -fsS -X POST "$hook" > /dev/null || true
          done <<< "$HOOKS"
